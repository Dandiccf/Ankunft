[package]
name = "ankunft"
version = "0.1.0"
edition = "2024"
description = "A polished GNOME client for Parcel Premium"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6", "gtk_v4_18"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secrecy = "0.10.3"
secret = { package = "libsecret", version = "0.9.0", features = ["v0_21_2"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
zeroize = "1.8.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
