name: Flatpak packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3 xvfb xauth dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build offline package
        run: dbus-run-session -- bash scripts/build-flatpak.sh
      - name: Verify installed bundle
        run: |
          flatpak install --user --noninteractive "dist/Ankunft-${{ matrix.arch }}.flatpak"
          dbus-run-session -- bash scripts/run-headless.sh python3 scripts/smoke-test.py flatpak run --socket=x11 --nosocket=wayland io.github.dandiccf.Ankunft
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Ankunft-${{ matrix.arch }}
          path: |
            dist/Ankunft-${{ matrix.arch }}.flatpak
            dist/Ankunft-${{ matrix.arch }}.flatpak.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Publish preview release with verified packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/*.flatpak dist/release/*.sha256 --verify-tag --prerelease --title "Ankunft $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
